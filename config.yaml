# StockScorecard Configuration
# Approved URS 1.1 + Architecture

project_name: "StockScorecard"
telegram_channel: "@nsepyscan"

market_cap_buckets:
  large: 20000
  mid: 5000
  small: 500

scanning_frequency:
  normal: 1
  elevated: 2
  high_impact: 3

swing:
  min_liquidity_volume: 50000
  horizon_days_min: 5
  horizon_days_max: 20

long_term:
  max_debt_to_ebitda: 2.5
  horizon_months_min: 6
  horizon_months_max: 36

dark_horse:
  max_market_cap_cr: 15000
  prefer_low_institutional: true

active_sectors:
  - pharmaceuticals
  - banks_financials
  - information_technology
  - automobile_ev
  - defence_aerospace
  - chemicals
  - fmcg
  - metals_mining
  - energy_oil_gas_power
  - capital_goods_infra
  - realty
  - telecom
  - media
  - textiles
  - others_residual
  - penny_monitor


output_dir: data
max_ideas_per_list: 8

# News → score bias (auto-activates on target date)
news_intelligence:
  enabled_display: true          # always show headlines in reports
  score_bias_enabled: true       # master switch
  activate_on: "2026-09-01"      # IST calendar date – scoring bias turns ON from this day
  # Bias points applied to Swing ideas when headline matches sector/symbol
  bullish_points: 4
  bearish_points: -5
  min_impact_score: 5            # only strong headlines drive bias
