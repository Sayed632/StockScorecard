name: Early Volume

on:
  schedule:
    - cron: "50 4 * * 1-5"   # ~10:20 IST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_early_volume.py
      - run: |
          git config user.name "stockscorecard-bot"
          git config user.email "bot@stockscorecard.local"
          git add config/early_volume_latest.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: early volume list" || true
          git push origin main || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
