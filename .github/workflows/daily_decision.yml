# StockScorecard – Automated Daily Decision Report
# Runs at NSE-aligned times and posts to Telegram.

name: Daily Decision Report

on:
  schedule:
    # Pre-open slot (approx 08:50 IST = 03:20 UTC)
    - cron: "20 3 * * 1-5"
    # Post-close slot (approx 16:00 IST = 10:30 UTC)
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      force_frequency:
        description: "Force frequency (1 / 2 / 3). Leave empty for auto."
        required: false
        default: ""

jobs:
  run-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Heartbeat Telegram (proves job + secrets)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat:
              raise SystemExit("Missing TELEGRAM secrets")
          r = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat, "text": "⏳ StockScorecard daily job started…", "disable_web_page_preview": True},
              timeout=30,
          )
          data = r.json()
          print(data)
          if not data.get("ok"):
              raise SystemExit(f"Telegram failed: {data}")
          PY

      - name: Run StockScorecard decision system
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          if [ -n "${{ github.event.inputs.force_frequency }}" ]; then
            python scripts/run_decision.py --force-frequency ${{ github.event.inputs.force_frequency }}
          else
            python scripts/run_decision.py
          fi

      - name: Upload CSV snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-snapshot-${{ github.run_id }}
          path: data/decision_*.csv
          if-no-files-found: ignore
          retention-days: 14
