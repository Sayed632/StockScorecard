# Wide parallel day-mover scan (full registry + broad universe)
name: Wide Parallel Scan

on:
  schedule:
    # ~11:00 IST and ~15:00 IST Mon-Fri (after open / near close)
    - cron: "30 5 * * 1-5"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

jobs:
  wide-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run wide parallel scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_wide_scan.py
