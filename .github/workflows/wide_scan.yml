name: Wide Parallel Scan

on:
  schedule:
    - cron: "30 5 * * 1-5"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wide-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run wide parallel scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_wide_scan.py
      - name: Commit watchlist for next-day plan
        run: |
          git config user.name "stockscorecard-bot"
          git config user.email "bot@stockscorecard.local"
          true
          git add config/wide_scan_watch.json || true
          git diff --staged --quiet || git commit -m "chore: wide-scan watchlist for next-day plan"
          git push || true
