name: Sector Niches (Fast Path)

# One flow covering all sector niches: pharma, metals, banks, IT, defence, …
# Faster than full-universe Swing Catcher – primary daily shortlist.

on:
  schedule:
    - cron: "0 4 * * 1-5"     # ~09:30 IST
    - cron: "30 7 * * 1-5"    # ~13:00 IST
  workflow_dispatch:

jobs:
  sector-niches:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run all sector niche scanners
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_decision.py --force-frequency 2
