name: Sector Heat Map

on:
  schedule:
    - cron: "15 5 * * 1-5"   # ~10:45 IST
  workflow_dispatch:
jobs:
  heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run sector heat map
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_sector_heatmap.py
      - name: Commit sector snapshot for Streamlit
        run: |
          git config user.name "stockscorecard-bot"
          git config user.email "bot@stockscorecard.local"
          git add config/sector_rotation_latest.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: sector rotation snapshot for Streamlit" || true
          git push origin main || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
