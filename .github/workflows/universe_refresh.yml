name: Universe Refresh (NSE + IPO merge)

on:
  schedule:
    - cron: "0 2 * * 1"   # Monday ~07:30 IST
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Refresh NSE cache + print universe size
        run: python scripts/run_universe_refresh.py
      - name: Commit cache if changed
        run: |
          git config user.name "stockscorecard-bot"
          git config user.email "bot@stockscorecard.local"
          git add config/nse_equity_cache.yaml || true
          git diff --staged --quiet || git commit -m "chore: refresh NSE equity universe cache"
          git push || true
