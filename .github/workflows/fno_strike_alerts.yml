name: F&O Strike Alerts

on:
  schedule:
    # Market hours denser – still not every second
    - cron: "20 3 * * 1-5"   # ~08:50 IST
    - cron: "50 4 * * 1-5"   # ~10:20 IST
    - cron: "20 6 * * 1-5"   # ~11:50 IST
    - cron: "50 7 * * 1-5"   # ~13:20 IST
    - cron: "20 9 * * 1-5"   # ~14:50 IST
  workflow_dispatch:

jobs:
  fno-strikes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run F&O strike alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_fno_strike_alerts.py
