name: Rally Detector

on:
  schedule:
    # More frequent on market days – catch multi-day rallies earlier
    - cron: "45 3 * * 1-5"   # ~09:15 IST
    - cron: "15 5 * * 1-5"   # ~10:45 IST
    - cron: "45 7 * * 1-5"   # ~13:15 IST
    - cron: "15 10 * * 1-5"  # ~15:45 IST
  workflow_dispatch:

jobs:
  rally:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run rally detector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_rally_detector.py
