# Dedicated corporate announcement ticker (story-style)
name: Corporate Alerts

on:
  schedule:
    # ~10:00, 12:30, 15:30 IST Mon-Fri
    - cron: "30 4 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

jobs:
  corporate-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run corporate alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_corporate_alerts.py
